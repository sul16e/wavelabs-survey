<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#20769B"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>웨이브랩스 유입 경로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --b1:#6EAAC2; --b2:#3C8EB1; --b3:#20769B; --b4:#0B5F84; --navy:#073F58;
    --paper:#EEF4F7; --card:#FFFFFF; --ink:#0B2E40; --ink-2:#3F6275; --ink-3:#7F9AAA; --line:#D3E1E9;
    --accent:#20769B; --accent-dk:#0B5F84; --accent-soft:#DCEBF3;
    --good:#1E9E6A; --crit:#BC3A2C;
    --shadow:0 12px 34px rgba(7,63,88,.28);
    --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--b3);color:#fff;font-family:var(--sans);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;overflow-x:hidden;
  }
  input,textarea{-webkit-user-select:text;user-select:text}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  /* ---------- kiosk screens (brand blue, single theme) ---------- */
  .screen{height:100svh;overflow:hidden;display:none;flex-direction:column;align-items:center;padding:clamp(12px,2.2vh,28px) clamp(16px,3vw,40px);position:relative;
    background:var(--b3);color:#fff}
  .screen.on{display:flex}
  .brand{display:flex;align-items:center;gap:14px;margin:0 0 1vh;z-index:1;align-self:center;flex:0 0 auto}
  .brand img{width:clamp(140px,17vw,220px);height:auto;display:block}
    padding:6px 14px;border-radius:22px 22px 22px 6px;transform:translateY(-14px) rotate(-6deg);box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .brand small{display:none}
  .center{width:min(1040px,100%);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.2vh,24px);z-index:1}
  h1{font-size:clamp(24px,4.2vw,44px);font-weight:700;line-height:1.24;text-align:center;margin:0;letter-spacing:-.01em;text-wrap:balance;color:#fff}
  h1 em{font-style:normal;color:#fff}
  .lead{font-size:clamp(15px,1.9vw,21px);color:#fff;font-weight:700;text-align:center;margin:0;line-height:1.45;text-wrap:balance;max-width:34em;background:transparent;border:2px dashed rgba(255,255,255,.75);padding:9px 20px;border-radius:12px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,1.4vw,16px);width:100%}
  .grid .opt:last-child{grid-column:1 / -1}
  @media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
  .opt{
    background:var(--card);border:2px solid transparent;border-radius:16px;padding:clamp(12px,1.8vh,20px) clamp(14px,2vw,22px);color:var(--ink);
    min-height:clamp(62px,9vh,86px);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:clamp(10px,1.2vw,16px);
    font-size:clamp(17px,2vw,24px);font-weight:700;line-height:1.25;box-shadow:none;transition:transform .12s,background .12s;
  }
  .opt .app{width:clamp(28px,3.4vw,40px);height:auto;border-radius:22%;display:block;flex:0 0 auto}
  .opt .app.stroke{box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .opt:active{transform:scale(.96);background:var(--accent-soft);border-color:var(--b1)}
  .opt.ghost{background:rgba(255,255,255,.22);border-color:transparent;color:#fff;box-shadow:none}
  .opt.ghost:active{background:rgba(255,255,255,.35)}

  /* etc screen */
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
  @media (max-width:700px){.chips{grid-template-columns:1fr}}
  .chip{background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:16px 14px;font-size:clamp(16px,1.9vw,21px);font-weight:700}
  .chip:active{background:var(--accent-soft);border-color:var(--b1)}
  .or{display:flex;align-items:center;gap:14px;width:100%;color:rgba(255,255,255,.7);font-size:14px;letter-spacing:.2em}
  .or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.35)}
  .free{display:flex;gap:12px;width:100%}
  .free input{flex:1;font-size:clamp(16px,1.9vw,21px);padding:14px 18px;border:2px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);font-family:inherit}
  .free input::placeholder{color:var(--ink-3)}
  .free input:focus{outline:none;border-color:var(--b1)}
  .btn{border:none;border-radius:14px;padding:14px 24px;font-size:clamp(16px,1.8vw,20px);font-weight:700;background:var(--b4);color:#fff}
  .btn:active{background:var(--navy)}
  .btn:disabled{opacity:.45}
  .back{position:absolute;top:22px;left:22px;background:rgba(255,255,255,.14);border:none;font-size:18px;font-weight:500;color:#fff;padding:10px 16px;border-radius:12px;z-index:2}

  /* thanks */
  .thanks{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
  .thanks .mark{width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 14px 40px rgba(0,0,0,.25)}
  .thanks .mark svg{width:58px;height:58px}
  .thanks h2{font-size:clamp(28px,4vw,46px);margin:0;letter-spacing:-.01em}
  .thanks p{font-size:clamp(17px,2vw,23px);color:rgba(255,255,255,.88);margin:0;line-height:1.55;text-wrap:balance}
  .thanks .picked{display:inline-block;background:#fff;color:var(--b3);padding:4px 12px;border-radius:10px;font-weight:700}
  .countdown{font-size:14px;color:rgba(255,255,255,.6);letter-spacing:.1em}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.thanks{animation:none}.opt,.chip{transition:none}}

  /* gear */
  .gear{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:#fff;opacity:.3;display:grid;place-items:center;z-index:5}
  .gear svg{width:22px;height:22px}

  /* ---------- password ---------- */
  .modal{position:fixed;inset:0;background:rgba(11,95,132,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .modal.on{display:flex}
  .pad{background:var(--card);color:var(--ink);border-radius:24px;padding:28px 28px 24px;width:min(360px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;align-items:center}
  .pad h3{margin:0;font-size:18px;font-weight:700}
  .dots{display:flex;gap:12px;height:18px}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3);display:block}
  .dots i.f{background:var(--accent);border-color:var(--accent)}
  .dots.err i{border-color:var(--crit);background:transparent;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
  .keys button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
  .keys button:active{background:var(--accent-soft)}
  .keys .fn{font-size:15px;color:var(--ink-2)}

  /* ---------- admin (light, same palette) ---------- */
  #admin{display:none;min-height:100svh;background:var(--paper);color:var(--ink)}
  #admin.on{display:block}
  .adm-head{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,32px);background:var(--b3);color:#fff;position:sticky;top:0;z-index:3;flex-wrap:wrap}
  .adm-head .brand{margin:0}
  .adm-head .brand img{width:150px}
  .adm-head .brand .bubble{display:none}
  .adm-head h2{font-size:17px;font-weight:700;margin:0;color:rgba(255,255,255,.8)}
  .adm-head .sp{flex:1}
  .seg{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.1)}
  .seg button{border:none;background:transparent;padding:9px 14px;font-size:14px;font-weight:500;color:#fff}
  .seg button.on{background:#fff;color:var(--b4)}
  .tool{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:500}
  .tool.danger{color:#FFB4A8}
  .adm-body{padding:clamp(16px,3vw,32px);display:grid;gap:22px;max-width:1180px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .stat b{display:block;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--b4)}
  .stat span{font-size:13px;color:var(--ink-2)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .panel h3{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  .bars{display:grid;gap:9px}
  .bar{display:grid;grid-template-columns:minmax(92px,auto) 1fr 44px;align-items:center;gap:12px;font-size:14px}
  .bar .lab{color:var(--ink);font-weight:500;white-space:nowrap}
  .bar .tr{height:20px;background:var(--paper);border-radius:6px;overflow:hidden}
  .bar .fl{height:100%;background:var(--b3);border-radius:6px;min-width:2px;transition:width .3s}
  .bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .bar.weak .fl{background:var(--line)}
  .hours{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:130px}
  .hours .h{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .hours .h .fl{width:100%;background:var(--b3);border-radius:4px 4px 0 0;min-height:2px}
  .hours .h .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .hours .h .lab{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.06em}
  td.num{font-variant-numeric:tabular-nums;color:var(--ink-2)}
  td.txt{white-space:normal;max-width:36ch}
  .tag{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--accent-soft);color:var(--accent-dk);font-weight:500;font-size:13px}
  .tag.etc{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
  .empty{color:var(--ink-3);padding:24px;text-align:center}
  .del{border:1px solid var(--line);background:var(--card);color:var(--ink-3);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:500}
  .del:active{background:#FDECEA;border-color:var(--crit);color:var(--crit)}
  .sync{font-size:12px;color:var(--ink-3)}
  .sync.ok{color:var(--good)}
</style>

    <h2>유입 경로 분석</h2>
    <div class="sp"></div>
    <div class="seg" id="range">
      <button data-r="today">오늘</button>
      <button data-r="7">7일</button>
      <button data-r="30">30일</button>
      <button data-r="all" class="on">전체</button>
    </div>
    <button class="tool" id="csvBtn">CSV 저장</button>
    <button class="tool danger" id="wipeBtn">전체 삭제</button>
    <button class="tool" id="exitBtn">닫기</button>
  </div>
  <div class="adm-body">
    <div class="sync" id="sync">저장 상태 확인 중…</div>
    <div class="stats" id="stats"></div>
    <div class="two">
      <div class="panel"><h3>채널별</h3><div class="bars" id="byCh"></div></div>
      <div class="panel"><h3>요일별</h3><div class="bars" id="byDow"></div></div>
    </div>
    <div class="panel"><h3>시간대별 (12시~23시)</h3><div class="hours" id="byHour"></div></div>
    <div class="panel"><h3>기타 · 직접 입력 내용</h3><div class="bars" id="byDetail"></div></div>
    <div class="panel"><h3>전체 응답 (최근순)</h3><div class="tbl-wrap"><table><thead><tr><th>날짜</th><th>요일</th><th>시각</th><th>채널</th><th>내용</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
  </div>
</section>

<script>
(function(){
  const LS_KEY='wl-referral-v1';
  const DOW=['일','월','화','수','목','금','토'];
  const CH_ORDER=['네이버지도','카카오맵','엘리베이터 전단','텔온 단골','기타'];
  const $=s=>document.querySelector(s);
  let db=null, downloads=null, dbReady=false;
  let range='all';

  // ---- capability (lights up later; page works without) ----
  if(window.claude && window.claude.use){
    claude.use('db').then(d=>{db=d;dbReady=!!d;}).catch(()=>{});
    claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});
  }

  // ---- 자동 업데이트 (사장이 새로고침 안 해도 됨) ----
  // 2분마다 version.txt를 확인해서 값이 바뀌었으면, 홈 화면이고 손님이 안 만지는 동안에만 새로고침
  const BUILD='20260918-100859';
  (function autoUpdate(){
    if(BUILD.indexOf('__')===0) return;              // 로컬/아티팩트에서 열었을 땐 동작 안 함
    let lastTouch=Date.now(), pending=null;
    ['touchstart','mousedown','keydown'].forEach(ev=>
      document.addEventListener(ev,()=>{lastTouch=Date.now()},{passive:true,capture:true}));
    function idleHome(){
      return document.getElementById('home').classList.contains('on')
        && !document.getElementById('admin').classList.contains('on')
        && !document.getElementById('pwModal').classList.contains('on')
        && Date.now()-lastTouch > 15000;
    }
    function reload(v){
      const u=location.origin+location.pathname+'?v='+encodeURIComponent(v);
      location.replace(u);
    }
    async function check(){
      try{
        const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});
        if(!r.ok)return;
        const v=(await r.text()).trim();
        if(!v||v===BUILD)return;
        pending=v;
      }catch(e){}
    }
    setInterval(check,120000);
    setInterval(()=>{if(pending&&idleHome())reload(pending)},5000);
    setTimeout(check,8000);
  })();

  // ---- storage ----
  function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){return[]}}
  function saveLocal(list){try{localStorage.setItem(LS_KEY,JSON.stringify(list))}catch(e){}}
  function pad(n){return String(n).padStart(2,'0')}
  function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

  async function record(channel, detail){
    const d=new Date();
    const item={id:d.getTime().toString(36)+Math.random().toString(36).slice(2,6),
      ts:d.toISOString(), day:dayKey(d), dow:d.getDay(), hour:d.getHours(), min:d.getMinutes(),
      channel, detail:detail||''};
    const list=loadLocal(); list.push(item); saveLocal(list);
    if(db){
      try{
        const ref=db.doc('responses/'+item.day);
        const snap=await ref.get();
        const items=(snap.exists && Array.isArray(snap.data().items))?snap.data().items.slice():[];
        items.push(item);
        await ref.set({day:item.day,items});
      }catch(e){/* local copy already kept */}
    }
  }

  async function loadAll(){
    const local=loadLocal();
    const map=new Map(local.map(i=>[i.id,i]));
    let remote=false;
    if(db){
      try{
        const q=await db.collection('responses').get();
        q.docs.forEach(doc=>{const it=doc.data().items||[];it.forEach(i=>{if(i&&i.id)map.set(i.id,i)})});
        remote=true;
      }catch(e){}
    }
    const all=[...map.values()].sort((a,b)=>a.ts<b.ts?1:-1);
    return {all,remote};
  }

  // ---- screens ----
  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
  let backTimer=null;
  function thanks(label){
    $('#pickedLabel').textContent=label;
    show('done');
    let n=4; const cd=$('#countdown');
    cd.textContent='잠시 후 처음 화면으로 돌아갑니다';
    clearInterval(backTimer);
    backTimer=setInterval(()=>{n--; if(n<=0){clearInterval(backTimer);show('home');}},1000);
  }
  $('#options').addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b)return;
    const ch=b.dataset.ch;
    if(ch==='기타'){ $('#freeText').value=''; $('#freeBtn').disabled=true; show('etc'); return; }
    record(ch,''); thanks(ch);
  });
  $('#etcBack').addEventListener('click',()=>show('home'));
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    record('기타',c.dataset.detail); thanks(c.dataset.detail);
  }));
  $('#freeText').addEventListener('input',e=>{$('#freeBtn').disabled=!e.target.value.trim()});
  $('#freeForm').addEventListener('submit',e=>{
    e.preventDefault();
    const t=$('#freeText').value.trim(); if(!t)return;
    $('#freeText').blur();
    record('기타',t); thanks(t);
  });
  // 감사 화면 어디든 누르면 바로 홈
  $('#done').addEventListener('click',()=>{clearInterval(backTimer);show('home')});

  // ---- password ----
  let pw='';
  function expected(){const d=new Date();return pad(d.getMonth()+1)+pad(d.getDate())+'00'}
  function drawDots(){const ds=$('#dots');ds.classList.remove('err');[...ds.children].forEach((i,k)=>i.classList.toggle('f',k<pw.length))}
  $('#gear').addEventListener('click',()=>{pw='';drawDots();$('#pwModal').classList.add('on')});
  $('#keys').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    const k=b.dataset.k||b.textContent;
    if(k==='x'){$('#pwModal').classList.remove('on');return}
    if(k==='b'){pw=pw.slice(0,-1);drawDots();return}
    if(pw.length>=6)return;
    pw+=k; drawDots();
    if(pw.length===6){
      if(pw===expected()){$('#pwModal').classList.remove('on');openAdmin()}
      else{$('#dots').classList.add('err');setTimeout(()=>{pw='';drawDots()},450)}
    }
  });

  // ---- admin ----
  let cache=[];
  async function openAdmin(){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    $('#gear').style.display='none';
    $('#admin').classList.add('on');
    $('#sync').textContent='불러오는 중…';
    const {all,remote}=await loadAll();
    cache=all;
    const s=$('#sync');
    s.className='sync'+(remote?' ok':'');
    s.textContent=remote?'✓ 클라우드 저장 연결됨 · 이 아이패드 기록 '+loadLocal().length+'건 포함':'이 아이패드에만 저장된 기록입니다 (클라우드 미연결)';
    render();
  }
  $('#exitBtn').addEventListener('click',()=>{$('#admin').classList.remove('on');$('#gear').style.display='';show('home')});
  $('#range').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    range=b.dataset.r; [...$('#range').children].forEach(x=>x.classList.toggle('on',x===b)); render();
  });
  function filtered(){
    if(range==='all')return cache;
    const now=new Date();
    if(range==='today'){const k=dayKey(now);return cache.filter(i=>i.day===k)}
    const from=new Date(now.getTime()-Number(range)*864e5).toISOString();
    return cache.filter(i=>i.ts>=from);
  }
  function bars(el,pairs,total){
    el.innerHTML='';
    if(!pairs.length){el.innerHTML='<div class="empty">아직 응답이 없어요</div>';return}
    const max=Math.max(...pairs.map(p=>p[1]),1);
    pairs.forEach(([lab,n])=>{
      const w=n/max*100, pct=total?Math.round(n/total*100):0;
      const row=document.createElement('div');row.className='bar'+(n===0?' weak':'');
      row.innerHTML='<span class="lab"></span><div class="tr"><div class="fl" style="width:'+w+'%"></div></div><span class="n">'+n+(total?' <small style="color:var(--ink-3)">'+pct+'%</small>':'')+'</span>';
      row.querySelector('.lab').textContent=lab; el.appendChild(row);
    });
  }
  function render(){
    const list=filtered(); const n=list.length;
    const today=cache.filter(i=>i.day===dayKey(new Date())).length;
    const days=new Set(list.map(i=>i.day)).size;
    const top=CH_ORDER.map(c=>[c,list.filter(i=>i.channel===c).length]).sort((a,b)=>b[1]-a[1])[0];
    $('#stats').innerHTML=[
      ['응답 수',n,'선택 기간'],['오늘',today,'건'],['응답 있던 날',days,'일'],
      ['1위 채널',n?top[0]:'–',n?top[1]+'건 · '+Math.round(top[1]/n*100)+'%':'']
    ].map(([l,v,s])=>'<div class="stat"><span>'+l+'</span><b>'+v+'</b><span>'+s+'</span></div>').join('');
    bars($('#byCh'),CH_ORDER.map(c=>[c,list.filter(i=>i.channel===c).length]),n);
    bars($('#byDow'),[1,2,3,4,5,6,0].map(d=>[DOW[d]+'요일'+(d===3?' (휴무)':''),list.filter(i=>i.dow===d).length]),n);
    // hours
    const hh=$('#byHour'); hh.innerHTML='';
    const hs=[];for(let h=12;h<=23;h++)hs.push([h,list.filter(i=>i.hour===h).length]);
    const before=list.filter(i=>i.hour<12).length;
    const mx=Math.max(...hs.map(p=>p[1]),1);
    hs.forEach(([h,c])=>{const d=document.createElement('div');d.className='h';d.innerHTML='<span class="n">'+(c||'')+'</span><div class="fl" style="height:'+(c/mx*80)+'%"></div><span class="lab">'+h+'</span>';hh.appendChild(d)});
    if(before){const d=document.createElement('div');d.className='h';d.style.gridColumn='span 12';d.innerHTML='<span class="n" style="align-self:flex-start">12시 이전 '+before+'건 (대관·오픈 전)</span>';hh.appendChild(d)}
    // details
    const dm=new Map();list.filter(i=>i.channel==='기타').forEach(i=>{const k=i.detail||'(내용 없음)';dm.set(k,(dm.get(k)||0)+1)});
    bars($('#byDetail'),[...dm.entries()].sort((a,b)=>b[1]-a[1]),0);
    // rows
    const tb=$('#rows'); tb.innerHTML='';
    if(!list.length){tb.innerHTML='<tr><td colspan="6" class="empty">아직 응답이 없어요</td></tr>'}
    list.slice(0,300).forEach(i=>{
      const d=new Date(i.ts);
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="num">'+i.day.slice(5)+'</td><td>'+DOW[i.dow]+'</td><td class="num">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</td><td><span class="tag'+(i.channel==='기타'?' etc':'')+'"></span></td><td class="txt"></td><td style="text-align:right"><button class="del" data-id="'+i.id+'">삭제</button></td>';
      tr.querySelector('.tag').textContent=i.channel; tr.querySelector('.txt').textContent=i.detail||'';
      tb.appendChild(tr);
    });
  }
  // 한 건만 삭제 (테스트로 잘못 누른 응답 취소용)
  $('#rows').addEventListener('click',async e=>{
    const b=e.target.closest('.del'); if(!b)return;
    const id=b.dataset.id, item=cache.find(x=>x.id===id); if(!item)return;
    if(!confirm('이 응답 1건을 삭제할까요?\n'+item.day.slice(5)+' '+item.channel+(item.detail?' · '+item.detail:'')))return;
    b.disabled=true;
    saveLocal(loadLocal().filter(x=>x.id!==id));
    if(db){
      try{
        const ref=db.doc('responses/'+item.day);
        const snap=await ref.get();
        if(snap.exists){
          const items=(snap.data().items||[]).filter(x=>x&&x.id!==id);
          if(items.length) await ref.set({day:item.day,items}); else await ref.delete();
        }
      }catch(err){}
    }
    cache=cache.filter(x=>x.id!==id); render();
  });

  $('#csvBtn').addEventListener('click',async()=>{
    const list=filtered();
    const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv='﻿'+['날짜,요일,시각,채널,내용'].concat(list.map(i=>{const d=new Date(i.ts);return [i.day,DOW[i.dow],pad(d.getHours())+':'+pad(d.getMinutes()),i.channel,i.detail].map(esc).join(',')})).join('\n');
    const name='웨이브랩스_유입경로_'+dayKey(new Date())+'.csv';
    if(downloads){try{await downloads.save({filename:name,data:csv})}catch(e){}return}
    try{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){}
  });
  $('#wipeBtn').addEventListener('click',async()=>{
    if(!confirm('모든 응답 기록을 삭제할까요? 되돌릴 수 없습니다.'))return;
    saveLocal([]);
    if(db){try{const q=await db.collection('responses').get();for(const d of q.docs){await db.doc('responses/'+d.id).delete()}}catch(e){}}
    cache=[]; render();
  });
})();
</script>

</body></html>
